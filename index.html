<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.json">
<title>Lorcana Collection</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#0b1020;
  color:#fff;
}
header{
  position:sticky;top:0;z-index:10;
  padding:calc(16px + env(safe-area-inset-top)) 16px 14px;
  background:#111827;
}
h1{margin:0;font-size:25px}
.sub{color:#9ca3af;font-size:13px;margin-top:4px}

nav{
  display:flex;gap:8px;
  padding:10px 12px;
  background:#111827;
  overflow:auto;
}
nav button,.btn{
  border:0;border-radius:12px;
  padding:10px 14px;
  background:#1f2937;color:white;
  font-weight:700;
}
nav button.active,.btn.primary{background:#6366f1}

main{padding:14px;padding-bottom:100px}

.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;margin-bottom:14px
}
.stat{
  background:#151d30;
  border:1px solid #26314a;
  padding:15px;border-radius:16px
}
.stat b{font-size:25px;display:block}
.stat span{color:#9ca3af;font-size:12px}

.progress{
  height:9px;background:#283247;
  border-radius:99px;overflow:hidden;margin-top:8px
}
.progress div{height:100%;background:#6366f1}

.search{
  width:100%;border:1px solid #303b55;
  background:#151d30;color:#fff;
  padding:13px;border-radius:14px;
  font-size:16px;margin-bottom:10px
}
select{
  width:100%;padding:12px;
  border-radius:12px;background:#151d30;
  color:white;border:1px solid #303b55;
  margin-bottom:12px
}
.card{
  display:flex;gap:12px;
  padding:11px;
  background:#151d30;
  border:1px solid #26314a;
  border-radius:15px;
  margin-bottom:10px
}
.thumb{
  width:65px;height:91px;
  flex:0 0 auto;
  border-radius:8px;
  overflow:hidden;
  background:#252f46;
  display:grid;place-items:center
}
.thumb img{width:100%;height:100%;object-fit:cover}
.info{min-width:0;flex:1}
.name{font-weight:800;font-size:15px}
.meta{color:#9ca3af;font-size:12px;margin-top:4px}
.actions{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.small{
  border:0;border-radius:9px;
  padding:7px 9px;
  background:#273249;color:#fff
}
.small.on{background:#6366f1}

.loading,.empty{
  text-align:center;color:#9ca3af;
  padding:50px 20px
}
.settitle{
  font-size:20px;font-weight:800;
  margin:18px 2px 10px
}
.badge{
  display:inline-block;
  padding:3px 7px;border-radius:99px;
  background:#273249;
  font-size:10px;margin-top:5px
}
</style>
</head>

<body>

<header>
  <h1>✨ Lorcana Collection</h1>
  <div class="sub">Ma collection Disney Lorcana</div>
</header>

<nav>
  <button id="nav-home" class="active" onclick="page='home';render()">Accueil</button>
  <button id="nav-cards" onclick="page='cards';render()">Cartes</button>
  <button id="nav-owned" onclick="page='owned';render()">Possédées</button>
  <button id="nav-wish" onclick="page='wish';render()">Wishlist</button>
</nav>

<main id="app">
  <div class="loading">Chargement du catalogue Lorcana…</div>
</main>

<script>
const DATA_URL="https://lorcanajson.org/files/current/fr/allCards.json";

let cards=[];
let sets={};
let page="home";
let query="";
let selectedSet="all";

let collection=JSON.parse(
  localStorage.getItem("lorcanaCollection") || "{}"
);

function save(){
  localStorage.setItem(
    "lorcanaCollection",
    JSON.stringify(collection)
  );
}

function state(id){
  if(!collection[id]){
    collection[id]={
      owned:false,
      wish:false,
      qty:0
    };
  }
  return collection[id];
}

function esc(v){
  return String(v??"")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;");
}

function imageOf(c){
  const i=c.images||{};
  return i.full || i.normal || i.large ||
         i.medium || i.small || i.thumbnail ||
         c.image || c.imageUrl || "";
}

function setCode(c){
  return String(
    c.setCode ??
    c.setNumber ??
    c.set?.code ??
    ""
  );
}

function cardID(c){
  return String(
    c.id ??
    c.culture_invariant_id ??
    `${setCode(c)}-${c.number}`
  );
}

function cardName(c){
  return c.fullName ||
    [c.name,c.subtitle].filter(Boolean).join(" - ") ||
    "Carte Lorcana";
}

function setName(c){
  const code=setCode(c);
  return sets[code]?.name ||
         c.setName ||
         `Extension ${code}`;
}

function toggleOwned(id){
  const s=state(id);
  s.owned=!s.owned;
  if(s.owned && s.qty===0)s.qty=1;
  if(!s.owned)s.qty=0;
  save();render();
}

function toggleWish(id){
  state(id).wish=!state(id).wish;
  save();render();
}

function addQty(id){
  const s=state(id);
  s.owned=true;
  s.qty=(s.qty||0)+1;
  save();render();
}

function filtered(){
  let arr=cards;

  if(page==="owned")
    arr=arr.filter(c=>state(cardID(c)).owned);

  if(page==="wish")
    arr=arr.filter(c=>state(cardID(c)).wish);

  if(selectedSet!=="all")
    arr=arr.filter(c=>setCode(c)===selectedSet);

  if(query.trim()){
    const q=query.toLowerCase();
    arr=arr.filter(c=>
      cardName(c).toLowerCase().includes(q) ||
      String(c.number??"").includes(q)
    );
  }

  return arr;
}

function stats(){
  const owned=cards.filter(c=>state(cardID(c)).owned).length;
  const wish=cards.filter(c=>state(cardID(c)).wish).length;
  const pct=cards.length ?
    Math.round((owned/cards.length)*100) : 0;

  return {owned,wish,pct};
}

function home(){
  const s=stats();

  return `
  <div class="stats">
    <div class="stat">
      <b>${s.pct}%</b>
      <span>Collection complète</span>
      <div class="progress">
        <div style="width:${s.pct}%"></div>
      </div>
    </div>

    <div class="stat">
      <b>${cards.length}</b>
      <span>Cartes cataloguées</span>
    </div>

    <div class="stat">
      <b>${s.owned}</b>
      <span>Possédées</span>
    </div>

    <div class="stat">
      <b>${s.wish}</b>
      <span>Wishlist</span>
    </div>
  </div>

  <button class="btn primary"
    style="width:100%"
    onclick="page='cards';render()">
    🃏 Ouvrir le catalogue
  </button>

  <div class="settitle">Extensions</div>
  <div class="stat">
    <b>${Object.keys(sets).length}</b>
    <span>extensions détectées dans le catalogue français</span>
  </div>
  `;
}

function filters(){
  const options=Object.entries(sets)
    .sort((a,b)=>{
      const an=Number(a[0]),bn=Number(b[0]);
      if(!isNaN(an)&&!isNaN(bn))return an-bn;
      return a[0].localeCompare(b[0]);
    })
    .map(([code,s])=>
      `<option value="${esc(code)}"
       ${selectedSet===code?"selected":""}>
       ${esc(s.name||code)}
       </option>`
    ).join("");

  return `
  <input class="search"
    placeholder="🔎 Rechercher une carte..."
    value="${esc(query)}"
    oninput="query=this.value;renderCardsOnly()">

  <select onchange="selectedSet=this.value;render()">
    <option value="all">Toutes les extensions</option>
    ${options}
  </select>

  <div id="cardlist"></div>
  `;
}

function cardHTML(c){
  const id=cardID(c);
  const s=state(id);
  const img=imageOf(c);

  return `
  <div class="card">
    <div class="thumb">
      ${img
        ? `<img loading="lazy"
             src="${esc(img)}"
             alt="${esc(cardName(c))}">`
        : "🃏"}
    </div>

    <div class="info">
      <div class="name">${esc(cardName(c))}</div>

      <div class="meta">
        ${esc(setName(c))}
        • #${esc(c.number??"?")}
      </div>

      <span class="badge">${esc(c.rarity||"—")}</span>

      <div class="actions">
        <button class="small ${s.owned?"on":""}"
          onclick="toggleOwned('${esc(id)}')">
          ${s.owned?"✓ Possédée":"＋ Possédée"}
        </button>

        <button class="small ${s.wish?"on":""}"
          onclick="toggleWish('${esc(id)}')">
          ${s.wish?"♥ Wishlist":"♡ Wishlist"}
        </button>

        ${s.owned
          ? `<button class="small"
              onclick="addQty('${esc(id)}')">
              Qté ${s.qty||1} ＋
             </button>`
          : ""}
      </div>
    </div>
  </div>`;
}

function renderCardsOnly(){
  const box=document.getElementById("cardlist");
  if(!box)return;

  const arr=filtered();

  box.innerHTML=arr.length
    ? arr.slice(0,500).map(cardHTML).join("") +
      (arr.length>500
        ? `<div class="empty">
             ${arr.length} résultats.<br>
             Affine la recherche pour afficher une carte précise.
           </div>`
        : "")
    : `<div class="empty">Aucune carte trouvée.</div>`;
}

function render(){
  document.querySelectorAll("nav button")
    .forEach(x=>x.classList.remove("active"));

  const nav=document.getElementById(
    "nav-"+(page==="home"?"home":
    page==="cards"?"cards":
    page==="owned"?"owned":"wish")
  );

  if(nav)nav.classList.add("active");

  const app=document.getElementById("app");

  if(page==="home"){
    app.innerHTML=home();
    return;
  }

  app.innerHTML=filters();
  renderCardsOnly();
}

async function load(){
  const app=document.getElementById("app");

  try{
    const r=await fetch(DATA_URL,{cache:"no-cache"});
    if(!r.ok)throw new Error("HTTP "+r.status);

    const data=await r.json();

    cards=Array.isArray(data.cards)
      ? data.cards
      : [];

    sets=data.sets || {};

    render();

  }catch(e){
    app.innerHTML=`
      <div class="empty">
        <b>Impossible de charger le catalogue.</b>
        <br><br>
        Vérifie ta connexion Internet puis recharge l'application.
        <br><br>
        <small>${esc(e.message)}</small>
      </div>`;
  }
}

if("serviceWorker" in navigator){
  navigator.serviceWorker.register("./sw.js")
    .catch(()=>{});
}

load();
</script>

</body>
</html>
